services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_path_development
    ports:
      - "5432:5432"
    volumes:
      - health_path_postgres:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_path_development"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  health_path_postgres:
